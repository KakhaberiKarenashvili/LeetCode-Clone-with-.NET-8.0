<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Your Password</title>
</head>
<body style="margin: 0; padding: 0; background-color: #d0d0d0; font-family: Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #d0d0d0; padding: 40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color: #e8e8e8; border-radius: 10px; overflow: hidden;">

          <tr>
            <td style="padding: 40px 40px 32px 40px; border-bottom: 1px solid #cccccc;">
              <p style="margin: 0 0 10px 0; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #2d6a4f; font-family: Arial, sans-serif;">LeetCode Clone</p>
              <h1 style="margin: 0 0 6px 0; font-size: 28px; font-weight: 700; color: #1a1a1a; font-family: Arial, sans-serif;">You've Been Invited</h1>
              <p style="margin: 0; font-size: 14px; color: #777777; font-family: Arial, sans-serif;">An account has been created for you. Click the button below to set your password and activate your account.</p>
            </td>
          </tr>

          <tr>
            <td style="padding: 40px 40px 32px 40px; text-align: center;">
              <a href="{RedirectUrl}" style="display: inline-block; font-family: Arial, sans-serif; font-size: 15px; font-weight: 600; height: 48px; line-height: 48px; background: #2d6a4f; padding: 0 32px; text-decoration: none; color: #ffffff; border-radius: 6px;">Set Your Password</a>
            </td>
          </tr>

          <tr>
            <td style="padding: 0 40px;">
              <hr style="border: none; border-top: 1px solid #cccccc; margin: 0;" />
            </td>
          </tr>

          <tr>
            <td style="padding: 24px 40px; text-align: center;">
              <p style="margin: 0; font-size: 13px; color: #888888; font-family: Arial, sans-serif;">If you did not expect this invitation, you can safely ignore this email.</p>
              <p style="margin: 4px 0 0 0; font-size: 12px; color: #aaaaaa; font-family: Arial, sans-serif;">This email was generated automatically. Please do not reply.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
